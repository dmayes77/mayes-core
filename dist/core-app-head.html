<!-- Mayes Core – App head snippet v1.0.0 – Site settings › Custom code › Head (after the consent snippet).
     Makes the site open full screen, like an app, when a visitor adds it to their home screen.
     The home-screen icon is the Webclip image in Site settings › General (180×180 PNG, no transparency).
     Per site: set the short name (max ~12 characters, shown under the icon) and the theme color (the brand bar's background). -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Short Name">
<meta name="theme-color" content="#ffffff">
