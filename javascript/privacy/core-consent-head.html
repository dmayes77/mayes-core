<!-- Mayes Core – Consent head snippet v1.2.0 – Site settings › Custom code › Head, ABOVE the Google tag.
     Sets Google Consent Mode v2 defaults from the visitor's saved choice.
     Opt-in (default): analytics and marketing are denied until the visitor accepts; the cookie notice opens on the first visit.
     Opt-out: put <meta name="core-consent-mode" content="opt-out"> ABOVE this snippet. Analytics is on until the visitor
     turns it off in Cookie settings, the cookie notice never opens, and marketing stays off until they turn it on.
     Uses the storage key core-consent-v1. If a site sets <html data-consent-key="…">, change the key below to match. -->
<script>
window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}
(function(){var c={};try{c=JSON.parse(localStorage.getItem('core-consent-v1'))||{};}catch(e){}
var o=document.querySelector('meta[name="core-consent-mode"]'),out=!!o&&o.getAttribute('content')==='opt-out';
var a=(typeof c.analytics==='boolean'?c.analytics:out)?'granted':'denied',m=c.marketing?'granted':'denied';
gtag('consent','default',{analytics_storage:a,ad_storage:m,ad_user_data:m,ad_personalization:m,wait_for_update:500});})();
</script>
